<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batalla de Cocina</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#10162b;--panel:#161d38;--red:#e63946;--red2:#5a1a2a;--blue:#2f8cff;--blue2:#123566;--gold:#ffc83d;--ink:#f4f6ff;--card:#fff8ec;--green:#2ecc71;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;font-size:16px}
.app{max-width:1100px;margin:0 auto;padding:12px;display:grid;gap:12px}
header{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
h1{margin:0;font-size:clamp(24px,5vw,44px);text-align:center;line-height:1;color:var(--gold);text-shadow:0 3px 0 #0006}
.sub{text-align:center;margin:0;font-size:14px;opacity:.8}
.score{border-radius:16px;padding:8px 14px;display:flex;align-items:center;gap:10px;border:3px solid}
.score b{font-size:15px}.score .n{font-size:34px;font-weight:800;color:var(--gold);line-height:1;margin-left:auto}
.s1{background:var(--red2);border-color:var(--red)}.s2{background:var(--blue2);border-color:var(--blue);flex-direction:row-reverse}
.s2 .n{margin-left:0;margin-right:auto}
.stage{display:grid;grid-template-columns:1fr minmax(0,1.3fr) 1fr;gap:12px;align-items:stretch}
.kitchen{border-radius:18px;display:grid;place-items:center;font-size:clamp(70px,12vw,120px);min-height:200px;position:relative;overflow:hidden}
.k1{background:linear-gradient(160deg,#7a2233,#3b1220)}.k2{background:linear-gradient(200deg,#1c4a8c,#0d2145)}
.kitchen small{position:absolute;bottom:10px;font-size:15px;background:#0008;padding:2px 12px;border-radius:99px}
.kitchen.go{animation:bob .5s infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}
.center{background:var(--panel);border:2px solid #2c3766;border-radius:18px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:10px;justify-content:center}
.center h2{margin:0;font-size:22px}
.recipes{display:grid;gap:8px}
.rec{all:unset;cursor:pointer;background:var(--card);color:#2a1a10;border-radius:14px;padding:8px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;border:3px solid transparent}
.rec:hover{border-color:#d4af37}
.rec:focus-visible{outline:3px solid var(--gold)}
.rec.on{border-color:var(--green);box-shadow:0 0 0 3px #2ecc7155}
.rec .em{font-size:38px}.rec b{font-size:18px;display:block}.rec span{font-size:13px;opacity:.75;line-height:1.1;display:block}
.ings{font-size:22px;letter-spacing:3px}
.btn{all:unset;cursor:pointer;background:var(--green);color:#06301a;font-weight:800;font-size:20px;padding:8px 20px;border-radius:14px;box-shadow:0 5px 0 #1a8a4a;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1a8a4a}.btn:focus-visible{outline:3px solid var(--gold)}
.btn.alt{background:#2c3766;color:var(--ink);box-shadow:0 5px 0 #1a2247}
.big{font-size:clamp(44px,9vw,80px);font-weight:800;color:var(--gold);line-height:1}
.prog{display:grid;gap:6px;text-align:left}
.row{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.row .ic{display:flex;gap:4px;font-size:22px}.row .ic i{font-style:normal;opacity:.25;filter:grayscale(1)}.row .ic i.d{opacity:1;filter:none}
.bar{height:12px;background:#0a1024;border-radius:99px;overflow:hidden;grid-column:1/3}.bar div{height:100%;width:0;transition:width .2s}
.b1{background:var(--red)}.b2{background:var(--blue)}
.now{font-size:14px;opacity:.85}
.pads{display:grid;grid-template-columns:1fr minmax(0,1.3fr) 1fr;gap:12px}
.pad{border-radius:18px;padding:12px;border:3px solid}
.p1{background:linear-gradient(#3a1220,#2a0e18);border-color:var(--red)}.p2{background:linear-gradient(#0f2a55,#0a1c3a);border-color:var(--blue)}
.pad h3{margin:0 0 8px;font-size:16px;text-align:center}
.seq{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:46px;background:#0006;border-radius:12px;padding:6px;margin-bottom:10px}
.seq span{width:38px;height:38px;border-radius:50%;border:3px solid;display:grid;place-items:center;font-weight:800;font-size:18px;transition:.1s}
.p1 .seq span{border-color:#d88}.p2 .seq span{border-color:#8bd}
.seq span.ok{background:var(--green);border-color:var(--green);color:#052}
.seq span.next{background:var(--gold);border-color:var(--gold);color:#321;transform:scale(1.12)}
.seq.bad{animation:sh .25s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{border-radius:12px;padding:10px 0;text-align:center;font-weight:800;font-size:26px;border:3px solid;transition:.06s}
.p1 .key{background:#b32335;border-color:#ff6b7a}.p2 .key{background:#1d64c8;border-color:#6bb4ff}
.key.hit{transform:translateY(3px) scale(.95);filter:brightness(1.5)}
.hint{font-size:13px;text-align:center;margin:8px 0 0;opacity:.85}
.hist{background:var(--panel);border:2px solid #2c3766;border-radius:18px;padding:12px}
.hist h3{margin:0 0 6px;font-size:16px}
.hist ol{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:130px;overflow:auto;font-size:14px}
.hist li{display:flex;gap:10px;background:#0a1024;border-radius:8px;padding:3px 10px}
.hist li.a{color:#ff8a96}.hist li.c{color:#7fbfff}.hist li em{font-style:normal;margin-left:auto;color:var(--gold)}
.tools{display:flex;justify-content:flex-end;margin-top:8px}
.tools button{all:unset;cursor:pointer;font-size:13px;opacity:.7;text-decoration:underline}
.mid{display:grid;gap:12px;align-content:start}
@media(max-width:820px){
header{grid-template-columns:1fr 1fr}header>div:nth-child(2){grid-column:1/3;grid-row:1}
.stage{grid-template-columns:1fr 1fr}.center{grid-column:1/3;grid-row:1}.kitchen{min-height:120px}
.pads{grid-template-columns:1fr 1fr}.mid{grid-column:1/3;grid-row:2}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="score s1"><span style="font-size:34px">👩‍🍳</span><div><b>Jugador 1</b></div><div class="n" id="sc1">0</div></div>
    <div><h1>Batalla de Cocina</h1><p class="sub">Sé más rápido que tu rival y completa la receta</p></div>
    <div class="score s2"><span style="font-size:34px">👨‍🍳</span><div><b>Jugador 2</b></div><div class="n" id="sc2">0</div></div>
  </header>

  <section class="stage">
    <div class="kitchen k1" id="k1"><span>🍳</span><small>Cocina roja</small></div>
    <div class="center" id="center"></div>
    <div class="kitchen k2" id="k2"><span>🍲</span><small>Cocina azul</small></div>
  </section>

  <section class="pads">
    <div class="pad p1"><h3>Secuencia de botones (Jugador 1)</h3><div class="seq" id="seq1"></div>
      <div class="keys" id="keys1"></div><p class="hint">Teclas: Q W E A S D</p></div>
    <div class="mid">
      <div class="hist"><h3>Historial de puntos</h3><ol id="hist"></ol>
        <div class="tools"><button id="reset">Borrar puntos</button></div></div>
    </div>
    <div class="pad p2"><h3>Secuencia de botones (Jugador 2)</h3><div class="seq" id="seq2"></div>
      <div class="keys" id="keys2"></div><p class="hint">Teclas: U J I K O L</p></div>
  </section>
</div>

<script>
const RECIPES=[
 {n:'Hamburguesa clásica',d:'Pan, carne, lechuga, tomate y queso.',e:'🍔',s:[['🍞','Tuesta el pan'],['🥩','Cocina la carne'],['🥬','Lava la lechuga'],['🍅','Corta el tomate'],['🧀','Funde el queso']]},
 {n:'Pizza margarita',d:'Masa, salsa, mozzarella, albahaca y horno.',e:'🍕',s:[['🫓','Estira la masa'],['🍅','Extiende la salsa'],['🧀','Reparte el queso'],['🌿','Añade albahaca'],['🔥','Hornea']]},
 {n:'Tacos mexicanos',d:'Tortilla, carne, cebolla, aguacate y salsa.',e:'🌮',s:[['🫓','Calienta la tortilla'],['🥩','Asa la carne'],['🧅','Pica la cebolla'],['🥑','Prepara el aguacate'],['🌶️','Salsa picante']]}
];
const K=[['q','w','e','a','s','d'],['u','j','i','k','o','l']];
const $=id=>document.getElementById(id);
let store={p:[0,0],h:[]};
try{const t=JSON.parse(localStorage.getItem('batalla-cocina'));if(t&&t.p)store=t}catch(e){}
const save=()=>{try{localStorage.setItem('batalla-cocina',JSON.stringify(store))}catch(e){}};
let rec=0,state='select',P=[],timer=null;

function renderScore(){
  $('sc1').textContent=store.p[0];$('sc2').textContent=store.p[1];
  $('hist').innerHTML=store.h.length?store.h.slice().reverse().map(x=>`<li class="${x.j?'c':'a'}"><b>Jugador ${x.j+1}</b><em>+1</em><span>${x.r}</span></li>`).join(''):'<li>Aún no hay puntos.</li>';
}
['1','2'].forEach((n,i)=>{$('keys'+n).innerHTML=K[i].map(k=>`<div class="key" data-k="${k}">${k.toUpperCase()}</div>`).join('')});

function select(){
  state='select';clearTimeout(timer);
  $('k1').classList.remove('go');$('k2').classList.remove('go');
  ['seq1','seq2'].forEach(i=>$(i).innerHTML='');
  $('center').innerHTML=`<h2>Elige una receta</h2><div class="recipes">`+RECIPES.map((r,i)=>
   `<button class="rec ${i==rec?'on':''}" data-i="${i}"><span class="em">${r.e}</span><div><b>${r.n}</b><span>${r.d}</span><div class="ings">${r.s.map(x=>x[0]).join('')}</div></div></button>`).join('')+
   `</div><button class="btn" id="start">Iniciar juego</button>`;
  document.querySelectorAll('.rec').forEach(b=>b.onclick=()=>{rec=+b.dataset.i;select()});
  $('start').onclick=start;
}

function newSeq(p){
  const pl=P[p],len=Math.min(3+pl.step,7);
  pl.seq=Array.from({length:len},()=>K[p][Math.floor(Math.random()*6)]);pl.pos=0;drawSeq(p);
}
function drawSeq(p){
  const pl=P[p];
  $('seq'+(p+1)).innerHTML=pl.seq.map((k,i)=>`<span class="${i<pl.pos?'ok':i==pl.pos?'next':''}">${k.toUpperCase()}</span>`).join('');
}
function start(){
  P=[0,1].map(()=>({step:0,seq:[],pos:0}));
  const r=RECIPES[rec];
  $('center').innerHTML=`<h2>${r.e} ${r.n}</h2><div class="big" id="cd">3</div><div class="now">¡Prepárate!</div>`;
  state='count';let c=3;
  const tick=()=>{
    if(c>0){$('cd').textContent=c--;timer=setTimeout(tick,800)}
    else{$('cd').textContent='¡YA!';timer=setTimeout(play,500)}
  };tick();
}
function play(){
  state='play';
  $('k1').classList.add('go');$('k2').classList.add('go');
  newSeq(0);newSeq(1);drawProg();
}
function drawProg(){
  const r=RECIPES[rec],n=r.s.length;
  const row=(p,c)=>`<div class="row"><div class="ic">${r.s.map((x,i)=>`<i class="${i<P[p].step?'d':''}">${x[0]}</i>`).join('')}</div>
    <b style="font-size:13px;text-align:right">J${p+1}</b><div class="bar"><div class="${c}" style="width:${P[p].step/n*100}%"></div></div></div>`;
  const cur=P.map(p=>r.s[Math.min(p.step,n-1)][1]);
  $('center').innerHTML=`<h2>Progreso de la receta</h2><div class="prog">${row(0,'b1')}${row(1,'b2')}</div>
   <div class="now">J1: ${cur[0]}<br>J2: ${cur[1]}</div>`;
}
function win(p){
  state='end';clearTimeout(timer);
  $('k1').classList.remove('go');$('k2').classList.remove('go');
  store.p[p]++;store.h.push({j:p,r:'Receta completada: '+RECIPES[rec].n});
  if(store.h.length>30)store.h.shift();save();renderScore();
  $('center').innerHTML=`<div class="big">🏆</div><h2>¡Gana el Jugador ${p+1}!</h2><div class="now">+1 punto</div>
   <button class="btn" id="again">Otra ronda</button><button class="btn alt" id="chg">Cambiar receta</button>`;
  $('again').onclick=start;$('chg').onclick=select;
}
document.addEventListener('keydown',e=>{
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  const p=K[0].includes(k)?0:K[1].includes(k)?1:-1;
  if(p<0||state!=='play')return;
  e.preventDefault();
  const el=document.querySelector(`#keys${p+1} [data-k="${k}"]`);
  if(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),110)}
  const pl=P[p];
  if(k===pl.seq[pl.pos]){
    pl.pos++;
    if(pl.pos===pl.seq.length){
      pl.step++;drawProg();
      if(pl.step>=RECIPES[rec].s.length){win(p);return}
      newSeq(p);
    }else drawSeq(p);
  }else{
    pl.pos=0;drawSeq(p);
    const s=$('seq'+(p+1));s.classList.remove('bad');void s.offsetWidth;s.classList.add('bad');
  }
});
$('reset').onclick=()=>{store={p:[0,0],h:[]};save();renderScore()};
renderScore();select();
</script>
</body>
</html>
